name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: graphql-bundle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install dependencies
        run: docker compose run --rm php composer update --no-interaction --prefer-dist

      - name: PHPStan
        run: docker compose run --rm php vendor/bin/phpstan analyse src --level=max --no-progress

      - name: PHP CS Fixer
        run: docker compose run --rm php vendor/bin/php-cs-fixer fix src --dry-run --diff

      - name: PHPUnit
        run: docker compose run --rm php vendor/bin/phpunit tests/
